<!DOCTYPE html>
<html lang="en">
<head>

    <title>Social Link Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <div class="profile-card">
              
            <div class="center-pfp">

            </div>

               </div>
               <p class="Info">'Front-end developer and avoid reader'</p>
               <div class="button-links">

                </div>

        </div>
